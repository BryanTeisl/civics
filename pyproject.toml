[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "civicpulse"
version = "2.0.0"
description = "Zero-hosting-cost municipal, county, and school board civic data pipeline and static exporter."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
civicpulse = "civicpulse.cli:main"

[tool.setuptools.packages.find]
include = ["civicpulse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
