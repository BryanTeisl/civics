<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Civic Core Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    #map { height: 340px; width: 100%; z-index: 1; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div class="max-w-6xl mx-auto px-4 py-8">
    <!-- Header -->
    <header class="mb-6">
      <h1 class="text-3xl font-bold tracking-tight text-slate-900">Civic Core Explorer</h1>
      <p class="text-slate-600 mt-1">
        Search or navigate the US map to inspect local voting records, official websites, and Vote Impactfulness metrics.
      </p>
    </header>

    <!-- Search Bar -->
    <div class="mb-4 relative">
      <input
        id="search-input"
        type="text"
        placeholder="Search city, county, or state (e.g., Fort Collins, Denver)..."
        class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
      <div
        id="search-results"
        class="hidden absolute left-0 right-0 mt-1 bg-white border border-slate-200 rounded-xl shadow-lg z-50 max-h-60 overflow-y-auto"
      ></div>
    </div>

    <!-- Interactive Map -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden mb-8">
      <div id="map"></div>
    </div>

    <!-- Jurisdiction Header -->
    <div class="mb-6 border-b border-slate-200 pb-4">
      <h2 id="jurisdiction-name" class="text-2xl font-bold text-slate-900">Select a jurisdiction</h2>
      <p id="last-updated" class="text-sm text-slate-500 mt-1"></p>
    </div>

    <!-- Main Two-Column Layout -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- Left: Elected Roster -->
      <aside class="bg-white rounded-xl border border-slate-200 shadow-sm p-4 h-fit">
        <h3 class="text-base font-semibold text-slate-800 pb-3 mb-3 border-b border-slate-100">
          Elected Roster
        </h3>
        <div id="roster-list" class="space-y-2">
          <p class="text-sm text-slate-500">Loading jurisdictions...</p>
        </div>
      </aside>

      <!-- Right: Selected Official & Voting Record -->
      <main id="official-detail" class="md:col-span-2 space-y-4">
        <div class="p-6 bg-white rounded-xl border border-slate-200 text-slate-500 text-sm">
          Select a pin on the map or choose an official from the roster to inspect their voting record.
        </div>
      </main>
    </div>
  </div>

  <script>
    const map = L.map('map').setView([39.5, -98.35], 4);

    // Keyless OpenStreetMap tiles
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    let jurisdictions = [];
    let currentData = null;

    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');
    const jurisdictionNameEl = document.getElementById('jurisdiction-name');
    const lastUpdatedEl = document.getElementById('last-updated');
    const rosterListEl = document.getElementById('roster-list');
    const officialDetailEl = document.getElementById('official-detail');

    async function init() {
      try {
        const res = await fetch('data/index.json');
        if (!res.ok) throw new Error('Could not load data/index.json');
        const indexData = await res.json();
        jurisdictions = Array.isArray(indexData) ? indexData : (indexData.jurisdictions || []);

        jurisdictions.forEach((j) => {
          if (typeof j.lat === 'number' && typeof j.lng === 'number') {
            const marker = L.marker([j.lat, j.lng]).addTo(map);
            marker.bindPopup(`<strong>${j.name}</strong>`);
            marker.on('click', () => loadJurisdiction(j));
          }
        });

        if (jurisdictions.length > 0) {
          loadJurisdiction(jurisdictions[0]);
        } else {
          rosterListEl.innerHTML = '<p class="text-sm text-slate-500">No jurisdictions found.</p>';
        }
      } catch (err) {
        console.error(err);
        rosterListEl.innerHTML = `<p class="text-sm text-red-600">Error loading index: ${err.message}</p>`;
      }
    }

    async function loadJurisdiction(j) {
      // Immediately clear previous jurisdiction's selected official so stale data never persists
      jurisdictionNameEl.textContent = j.name;
      lastUpdatedEl.textContent = 'Loading...';
      rosterListEl.innerHTML = '<p class="text-sm text-slate-500">Loading roster...</p>';
      officialDetailEl.innerHTML = '';

      if (typeof j.lat === 'number' && typeof j.lng === 'number') {
        map.flyTo([j.lat, j.lng], 6, { duration: 0.6 });
      }

      try {
        const rawFile =
          j.file ||
          j.data_file ||
          j.filename ||
          j.path ||
          `${(j.id || j.ocd_division_id || '').replace(/[/:]/g, '-')}.json`;
        const cleanFile = rawFile.replace(/^\.?\//, '').replace(/^public\//, '');
        const filePath = cleanFile.startsWith('data/') ? cleanFile : `data/${cleanFile}`;
        const res = await fetch(filePath);
        if (!res.ok) throw new Error(`Failed to load ${filePath}`);
        const data = await res.json();
        currentData = data;

        jurisdictionNameEl.textContent = data.name || j.name;
        lastUpdatedEl.textContent = data.last_updated ? `Last updated: ${data.last_updated}` : '';

        const officials = data.officials || data.entities || data.roster || data.legislators || data.people || data.members || [];
        
        if (officials.length === 0) {
          rosterListEl.innerHTML = '<p class="text-sm text-slate-500 py-2">No officials indexed yet.</p>';
          officialDetailEl.innerHTML = `
            <div class="p-6 bg-white rounded-xl border border-slate-200 text-slate-500 text-sm">
              No elected roster or roll-call votes have been ingested for <strong>${data.name || j.name}</strong> yet.
            </div>
          `;
          return;
        }

        renderRoster(officials);
        renderOfficial(officials[0]);
      } catch (err) {
        console.error(err);
        rosterListEl.innerHTML = `<p class="text-sm text-red-600">Error loading jurisdiction data.</p>`;
        officialDetailEl.innerHTML = `
          <div class="p-6 bg-white rounded-xl border border-red-200 text-red-600 text-sm">
            Could not load data for ${j.name}.
          </div>
        `;
      }
    }

    function renderRoster(officials) {
      rosterListEl.innerHTML = '';
      officials.forEach((person, idx) => {
        const btn = document.createElement('button');
        btn.className =
          'w-full text-left p-3 rounded-lg border border-slate-200 hover:border-blue-400 hover:bg-blue-50/40 transition focus:outline-none';
        const subtitle = [person.role, person.district].filter(Boolean).join(' • ');
        btn.innerHTML = `
          <div class="font-semibold text-slate-900">${person.name}</div>
          <div class="text-xs text-slate-500 mt-0.5">${subtitle}</div>
        `;
        btn.addEventListener('click', () => renderOfficial(person));
        rosterListEl.appendChild(btn);
      });
    }

    function renderOfficial(person) {
      const stats = person.stats || {};
      const totalVotes = stats.total_votes ?? (person.votes ? person.votes.length : 0);
      const attendance = stats.attendance_pct ?? 0;
      const pivotalCount = stats.pivotal_votes ?? 0;
      const pivotalPct = stats.pivotal_pct ?? 0;
      const subtitle = [person.role, person.district].filter(Boolean).join(' • ');

      const websiteBtn = person.official_website
        ? `<a href="${person.official_website}" target="_blank" rel="noopener noreferrer"
              class="inline-flex items-center px-4 py-2 rounded-lg bg-blue-600 text-white text-sm font-medium hover:bg-blue-700 transition">
              Official Website &rarr;
           </a>`
        : '';

      const votes = person.votes || [];
      let votesHtml = '';

      if (votes.length === 0) {
        votesHtml = `
          <div class="p-6 bg-white rounded-xl border border-slate-200 text-slate-500 text-sm">
            No roll-call votes extracted yet. Run watcher.py and worker.py to populate.
          </div>
        `;
      } else {
        votesHtml = votes
          .map((v) => {
            const voteColor =
              v.vote === 'Yes'
                ? 'bg-emerald-50 text-emerald-700 border-emerald-200'
                : v.vote === 'No'
                ? 'bg-rose-50 text-rose-700 border-rose-200'
                : 'bg-slate-100 text-slate-700 border-slate-200';

            const pivotalBadge = v.is_pivotal
              ? `<span class="ml-2 px-2 py-0.5 text-xs font-semibold rounded-full bg-amber-100 text-amber-800">Pivotal Vote</span>`
              : '';

            const sourceLink = v.source_url
              ? ` • <a href="${v.source_url}" target="_blank" rel="noopener noreferrer" class="text-blue-600 hover:underline">Official Source</a>`
              : '';

            const tally =
              v.yes_count !== undefined && v.no_count !== undefined
                ? ` (${v.yes_count}-${v.no_count})`
                : '';

            return `
              <article class="p-5 bg-white rounded-xl border border-slate-200 shadow-sm">
                <div class="flex items-start justify-between gap-4">
                  <div class="text-xs font-semibold uppercase tracking-wide text-blue-600">
                    ${v.topic || v.event_type || 'VOTE'} &bull; IMPACT SCORE: ${v.impact_score ?? 0}/100
                    ${pivotalBadge}
                  </div>
                  <span class="shrink-0 px-3 py-1 rounded-full text-xs font-semibold border ${voteColor}">
                    Voted ${v.vote}
                  </span>
                </div>
                <h4 class="text-base font-semibold text-slate-900 mt-2">${v.title}</h4>
                <div class="text-xs text-slate-500 mt-1">
                  ${v.meeting_date || ''} &bull; ${v.outcome || ''}${tally}${sourceLink}
                </div>
                ${
                  v.rationale_summary
                    ? `<p class="mt-3 p-3 rounded-lg bg-slate-50 text-sm text-slate-700 border border-slate-100">${v.rationale_summary}</p>`
                    : ''
                }
              </article>
            `;
          })
          .join('');
      }

      officialDetailEl.innerHTML = `
        <section class="p-5 bg-blue-50/40 rounded-xl border border-blue-200 flex flex-wrap items-center justify-between gap-4">
          <div>
            <h3 class="text-xl font-bold text-slate-900">${person.name}</h3>
            <p class="text-sm text-blue-700 font-medium">${subtitle}</p>
            <p class="text-xs text-slate-600 mt-2">
              Votes: ${totalVotes} | Attendance: ${attendance}% | Pivotal Votes: ${pivotalCount} (${pivotalPct}%)
            </p>
          </div>
          ${websiteBtn}
        </section>
        <div class="space-y-3">
          ${votesHtml}
        </div>
      `;
    }

    // Search filtering
    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (!q) {
        searchResults.classList.add('hidden');
        return;
      }
      const matches = jurisdictions.filter((j) => j.name.toLowerCase().includes(q));
      if (matches.length === 0) {
        searchResults.innerHTML = '<div class="px-4 py-3 text-sm text-slate-500">No matching jurisdictions</div>';
      } else {
        searchResults.innerHTML = matches
          .map(
            (j, idx) =>
              `<button data-idx="${idx}" class="w-full text-left px-4 py-2.5 text-sm hover:bg-slate-50 border-b border-slate-100 last:border-0">${j.name}</button>`
          )
          .join('');
        searchResults.querySelectorAll('button').forEach((btn, idx) => {
          btn.addEventListener('click', () => {
            loadJurisdiction(matches[idx]);
            searchInput.value = matches[idx].name;
            searchResults.classList.add('hidden');
          });
        });
      }
      searchResults.classList.remove('hidden');
    });

    document.addEventListener('click', (e) => {
      if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
        searchResults.classList.add('hidden');
      }
    });

    init();
  </script>
</body>
</html>
