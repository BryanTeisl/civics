name: Monthly Profile Enrichment (Ballotpedia & Socials)

on:
  schedule:
    - cron: "0 14 1 * *"  # 1st of every month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich-profiles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Enrich Ballotpedia & official social links
        run: |
          python enrich_socials.py
          python exporter.py

      - name: Commit and push updates
        run: |
          git config user.name "CivicPulse Bot"
          git config user.email "actions@github.com"
          git add core_civic.db public/data/
          if ! git diff --staged --quiet; then
            git commit -m "chore(bot): monthly Ballotpedia & social link enrichment"
            git push
          else
            echo "No profile link changes detected."
          fi
