name: Census Federal & Local Boundary Refresh (Jan & Oct)

on:
  schedule:
    # Runs at 06:00 UTC on January 15 (new Congress session seating) and October 25 (annual TIGER/Line vintage)
    - cron: "0 6 15 1 *"
    - cron: "0 6 25 10 *"
  workflow_dispatch:  # Allows 1-click manual runs anytime in GitHub Actions UI

permissions:
  contents: write

jobs:
  refresh-boundaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Sync Census TIGERweb federal, county, and municipal boundaries
        run: python sync_boundaries.py

      - name: Commit and push updated GeoJSON if boundaries changed
        run: |
          git config user.name "CivicPulse Boundary Bot"
          git config user.email "actions@github.com"
          git add public/geo/boundaries.geojson
          if ! git diff --staged --quiet; then
            git commit -m "chore(geo): scheduled Jan/Oct Census TIGERweb boundary refresh"
            git push
          else
            echo "No boundary changes detected in Census TIGERweb."
          fi
