name: CivicPulse CI & Data Hygiene

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package & dev dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]" || pip install -r requirements.txt pytest
          else
            pip install -r requirements.txt pytest
          fi

      - name: Check no tracked SQLite DB or __pycache__
        run: |
          if git ls-files | grep -E '(^|/)core_civic\.db$|__pycache__/'; then
            echo "ERROR: core_civic.db or __pycache__ is tracked in Git."
            exit 1
          fi

      - name: Run pytest test suite
        run: python -m pytest -v

      - name: Validate exported public/data schemas & naming hygiene
        run: |
          if [ -d public/data ] && [ -f scripts/validate_exports.py ]; then
            python scripts/validate_exports.py --data-dir public/data --allow-missing-optional
          else
            echo "Skipping export validation (public/data or validator not present)."
          fi
