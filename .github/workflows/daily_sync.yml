name: Daily Civic Data Sync & Export

on:
  schedule:
    - cron: "0 13 * * *"  # 6:00 AM MT / 7:00 AM MDT daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Poll active structured API jurisdictions & export JSON
        run: |
          python db.py
          python watcher.py
          python exporter.py

      - name: Commit and push updated DB & static JSON
        run: |
          git config user.name "CivicPulse Bot"
          git config user.email "actions@github.com"
          git add core_civic.db public/data/
          if ! git diff --staged --quiet; then
            git commit -m "chore(bot): daily civic data sync and JSON export"
            git push
          else
            echo "No new civic records to commit."
          fi
